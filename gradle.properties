android.useAndroidX=true
kotlin.code.style=official

# ============================================================================
# Memory budget
# ----------------------------------------------------------------------------
# Host: 6.8 GiB RAM, 12 CPUs. opencode itself holds ~2.2 GB across its
# processes, so the build must stay well under the remaining headroom. The
# long-lived build JVMs and their ceilings:
#
#   Gradle daemon :  896m heap + 384m metaspace + 192m code cache
#   Kotlin daemon :  768m heap + 320m metaspace + 192m code cache (reaped when idle)
#   Test forks    :  384m heap each, 2 forks (app/build.gradle.kts)
#   Worker pool   :  4 (org.gradle.workers.max)
#
# Reserved ceiling ≈ 2.7 GB, and the ACTUAL resident set is lower still: both
# daemons start small (-Xms) and release committed heap when idle (free-ratio +
# periodic-GC flags below), and the Kotlin daemon is shut down 2 minutes after
# its last compilation — returning its whole JVM baseline to the OS.
#
# Measured on this host, opencode live, clean 52-task build + 1207 tests:
#   PEAK ~4.9 GB used / ~2.8 GB Java, wall 116-139s, exit 0. Per-role peak RSS:
#     gradle-daemon 1113 MB · kotlin-daemon 1005 MB · worker ~300 MB · test fork 124 MB
#   Idle afterwards: Kotlin daemon reaped to zero, one Gradle daemon.
#   /proc/pressure/memory reports zero stalls throughout.
# Do NOT raise a ceiling without re-checking the total against this budget.
# ============================================================================

# --- Gradle daemon ----------------------------------------------------------
# Keep one stable JVM fingerprint so every build reuses the same daemon instead
# of spawning a new one on JVM-args mismatch (churn doubles resident memory).
# -Xmx896m covers single-module AGP configuration + dexing orchestration; the
# Kotlin compiler runs in its own 768m process (see kotlin.daemon.jvmargs).
#
# Idle-shrink flags: G1 only re-evaluates the heap free ratios at a GC pause, so
# without a periodic GC an idle daemon never gives committed memory back.
# MaxHeapFreeRatio=15 / MinHeapFreeRatio=5, -ShrinkHeapInSteps and
# G1PeriodicGCInterval=120000 (2 min) make the committed heap fall promptly once
# the build finishes. Measured idle: ~300 MB heap / ~270 MB metaspace.
#
# -XX:ActiveProcessorCount=6 is the biggest NATIVE-memory lever here. Measured
# RSS was ~1307 MB against only ~570 MB of heap+metaspace: the rest is
# thread/GC/JIT machinery sized to the host's 12 CPUs. With the worker pool
# already bounded at 2, telling the JVM it has 6 processors removes much of that
# machinery without touching build correctness.
#
# posix_spawn: cheaper process launch mechanism (kept from the previous config).
#
# -Dkotlin.daemon.options sets the Kotlin daemon LIFETIME. NOTE the property
# split: `kotlin.daemon.jvm.options` = raw JVM args only, `kotlin.daemon.options`
# = daemon options. Putting autoshutdownIdleSeconds in the former makes the JVM
# reject the daemon with "Unrecognized option: -autoshutdownIdleSeconds=120" and
# KGP silently falls back to in-process compilation. Verified working placement.
org.gradle.jvmargs=-Xms128m -Xmx896m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:ActiveProcessorCount=6 -XX:+UseG1GC -XX:MaxHeapFreeRatio=15 -XX:MinHeapFreeRatio=5 -XX:-ShrinkHeapInSteps -XX:G1PeriodicGCInterval=120000 -Djdk.lang.Process.launchMechanism=posix_spawn -Dkotlin.daemon.options=autoshutdownIdleSeconds=120,shutdownDelayMilliseconds=1000

# Reap the Gradle daemon after 10 minutes idle (Gradle default is 3 HOURS). A
# stopped daemon costs a cold start on the next build, but on this host an idle
# 1 GB daemon competes with opencode, so early reaping is the better trade.
org.gradle.daemon.idletimeout=600000

org.gradle.caching=true

# Single module (:app only) → cross-project parallelism is a no-op. Keep it off
# so the only concurrency is the explicitly bounded worker pool below.
org.gradle.parallel=false

# Bound Gradle's OWN pool: worker daemons (Javac/dexing), code-quality workers
# AND Test-task forks. Without this the 12-CPU default forks up to 12 JVMs.
#
# 4, not 2. Measured full-gate wall time on this host (clean, --rerun-tasks):
#     workers.max=2 → 215-221s      workers.max=4 → 120-142s
# The reason is a scheduling deadlock at 2: maxParallelForks=2 (app/build.gradle.kts)
# consumes BOTH workers for the whole test phase, so dexing (dexBuilderDebug ~18s,
# mergeExtDexDebug ~9s) and resource tasks cannot overlap with the test run. At 4
# the two forks plus dexing/resource workers proceed concurrently.
#
# Memory-neutral in practice: peak host usage 5407 MiB at 4 vs 5605 MiB at 2
# (transient workers are small — measured ~300 MB each), with /proc/pressure/memory
# showing zero stalls and no OOM either way. Keep this >= maxParallelForks + 2.
org.gradle.workers.max=4

# Configuration cache: skip re-running configuration on repeat builds
# (AGP 8.11, Kotlin 2.2, KSP, protobuf-plugin 0.10 and detekt all support it;
# incompatible custom tasks are reported but do not fail the build).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Kotlin compiler daemon -------------------------------------------------
# Owns its heap so it does NOT inherit the Gradle daemon's. 768m covers the
# ~38k-line main + ~31k-line test sources with incremental compilation; KSP Room
# generation runs in-process here. G1 is requested EXPLICITLY because the Kotlin
# daemon defaults to ParallelGC, which has no periodic-GC and therefore never
# releases idle heap. Same idle-shrink flags as the Gradle daemon.
#
# A consistently-applied arg set across all tasks keeps it to ONE daemon —
# per-task kotlinDaemonJvmArguments overrides would spawn a second, doubling the
# compiler footprint.
kotlin.daemon.jvmargs=-Xms128m -Xmx768m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=192m -XX:ActiveProcessorCount=6 -XX:+UseG1GC -XX:MaxHeapFreeRatio=15 -XX:MinHeapFreeRatio=5 -XX:-ShrinkHeapInSteps -XX:G1PeriodicGCInterval=120000
