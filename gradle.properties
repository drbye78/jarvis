android.useAndroidX=true
kotlin.code.style=official

# Daemon reuse: keep one stable JVM fingerprint so every build reuses the
# same daemon instead of spawning a new one on JVM-args mismatch.
# MaxMetaspaceSize caps the non-heap creep that gets daemons OOM-killed.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djdk.lang.Process.launchMechanism=posix_spawn
org.gradle.caching=true
org.gradle.parallel=true

# Configuration cache: skip re-running configuration on repeat builds
# (AGP 8.11, Kotlin 2.2, KSP, protobuf-plugin 0.10 and detekt all support it;
# incompatible custom tasks are reported but do not fail the build).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin daemon: cap its heap so Gradle daemon (2g) + Kotlin daemon fit
# alongside the OS on a 6 GB machine; consistent args also prevent
# Kotlin daemon churn between builds.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
